name: Verify WinGet Installation
description: Check the runner-provided WinGet CLI and Microsoft.WinGet.Client PowerShell module without modifying them.
runs:
  using: composite
  steps:
    - name: Verify WinGet Installation
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest

        if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
          throw 'The runner does not provide WinGet CLI on PATH. Runner-only setup does not install missing components.'
        }
        $cliVersion = winget --version
        if ($LASTEXITCODE -ne 0) {
          throw "Runner-provided WinGet CLI failed with exit code $LASTEXITCODE."
        }
        Write-Host "Runner-provided WinGet CLI version: $cliVersion"

        if (-not (Get-Module -ListAvailable -Name Microsoft.WinGet.Client)) {
          throw 'The runner does not provide Microsoft.WinGet.Client. Runner-only setup does not install missing components.'
        }
        Import-Module Microsoft.WinGet.Client -Force -ErrorAction Stop
        $moduleVersion = (Get-Module -Name Microsoft.WinGet.Client).Version
        Write-Host "Runner-provided Microsoft.WinGet.Client version: $moduleVersion"
