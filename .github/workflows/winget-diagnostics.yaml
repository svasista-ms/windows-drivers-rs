name: WinGet Diagnostics

on:
  push:
    branches: ['fix/winget-rpc-readiness']
  workflow_dispatch:
    inputs:
      module-version:
        description: Exact PowerShell module version under investigation
        default: '1.29.380'
        type: string
      upgrade-tag:
        description: Exact CLI release tag for the upgrade control
        default: 'v1.29.380'
        type: string
      expected-cli-version:
        description: Historical runner CLI version (warn on image drift; do not downgrade)
        default: '1.11.510'
        type: string

permissions:
  contents: read

concurrency:
  group: winget-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: WinGet / ${{ matrix.experiment }}
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        experiment: [control, register, upgrade, matching-module]
    defaults:
      run:
        shell: pwsh
    env:
      DIAG_MODULE_VERSION: ${{ inputs.module-version || '1.29.380' }}
      DIAG_UPGRADE_TAG: ${{ inputs.upgrade-tag || 'v1.29.380' }}
      DIAG_EXPECTED_CLI: ${{ inputs.expected-cli-version || '1.11.510' }}
      DIAG_EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Capture untouched runner
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP/winget-diagnostics" -Force | Out-Null
          [DateTime]::UtcNow.ToString('o') | Set-Content "$env:RUNNER_TEMP/winget-diagnostics/started-utc.txt"
          "| Phase | Probe | Success | Seconds |`n| --- | --- | --- | --- |" | Add-Content $env:GITHUB_STEP_SUMMARY
          ./.github/scripts/winget-diagnostics.ps1 -Phase Snapshot -ExpectedCliVersion $env:DIAG_EXPECTED_CLI

      - name: Start bounded process trace
        run: ./.github/scripts/winget-diagnostics.ps1 -Phase StartTrace

      - name: Install exact diagnostic module
        timeout-minutes: 3
        run: |
          if (-not (Get-PSResourceRepository PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSResourceRepository -PSGallery -Trusted
          }
          Install-PSResource Microsoft.WinGet.Client -Version $env:DIAG_MODULE_VERSION -Repository PSGallery -TrustRepository -Quiet -ErrorAction Stop

      - name: Probe before intervention
        timeout-minutes: 3
        run: ./.github/scripts/winget-diagnostics.ps1 -Phase Probe -ModuleVersion $env:DIAG_MODULE_VERSION

      - name: Capture failure evidence before intervention
        if: always()
        run: |
          ./.github/scripts/winget-diagnostics.ps1 -Phase Collect
          ./.github/scripts/winget-diagnostics.ps1 -Phase Snapshot -Label pre-intervention

      - name: Apply one intervention
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/winget-diagnostics.ps1 -Phase Intervene -Experiment $env:DIAG_EXPERIMENT -UpgradeTag $env:DIAG_UPGRADE_TAG

      - name: Probe after intervention in fresh process
        timeout-minutes: 3
        run: ./.github/scripts/winget-diagnostics.ps1 -Phase Probe -Label after -ModuleVersion $env:DIAG_MODULE_VERSION

      - name: Capture final evidence
        if: always()
        timeout-minutes: 2
        run: |
          ./.github/scripts/winget-diagnostics.ps1 -Phase StopTrace
          ./.github/scripts/winget-diagnostics.ps1 -Phase Snapshot -Label after
          ./.github/scripts/winget-diagnostics.ps1 -Phase Collect -Label after

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winget-${{ matrix.experiment }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/winget-diagnostics
            !${{ runner.temp }}/winget-diagnostics/release/**
          retention-days: 7
          if-no-files-found: warn